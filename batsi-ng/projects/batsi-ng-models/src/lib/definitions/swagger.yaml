# Generated mostly by https://roger13.github.io/SwagDefGen/
openapi: "3.0.0"
info:
  version: 1.0.0
  title: ÖBB Live Backend Info
  description: Get live train data
servers:
  - url: "http://127.0.0.1:8787"
  - url: "https://batsi-proxy.floppynotfound.workers.dev"

tags:
  - name: train
    description: Get live train data

paths:
  /backend/info:
    get:
      operationId: backendInfoGet
      tags:
        - train
      summary: Live train data
      parameters:
        - $ref: "#/components/parameters/apiTokenParam"
        - $ref: "#/components/parameters/trainNrParam"
        - $ref: "#/components/parameters/dateParam"
        - $ref: "#/components/parameters/stationParam"
      responses:
        200:
          description: Train information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trainInfoResponse"

  /assets/assets/stations.json:
    get:
      operationId: stationsGet
      tags:
        - stations
      summary: List available stations
      parameters:
        - $ref: "#/components/parameters/apiTokenParam"
      responses:
        200:
          description: List of stations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/stationsResponse"

components:
  parameters:
    apiTokenParam:
      name: api_token
      in: header
      required: true
      schema:
        type: string
    trainNrParam:
      name: trainNr
      in: query
      required: true
      description: Unique per day train number (without the train type information)
      example: 766
      schema:
        type: number
    dateParam:
      name: date
      in: query
      required: true
      description: Date at which the train operates
      example: "2022-12-31"
      schema:
        type: string
        format: date
        example: "YYYY-MM-DD"
    stationParam:
      name: station
      in: query
      required: true
      description: Unique station ID
      schema:
        type: integer
        format: int32
        example: 8100099

  schemas:
    trainInfoResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/id"
        platform:
          $ref: "#/components/schemas/platform"
        timeTableInfo:
          $ref: "#/components/schemas/timeTableInfo"
        train:
          $ref: "#/components/schemas/train"

    id:
      type: string

    platform:
      type: object
      properties:
        # TODO: egresses
        length:
          type: number
          example: 452.81
        # TODO: sectors
        # TODO: stoppingPoint

    timeTableInfo:
      type: object
      properties:
        date:
          type: string
          format: date
        platform:
          type: string
        renderedTrainName:
          type: string
        sector:
          type: string
        stationName:
          type: string
        time:
          type: string
          example: "0.11:28"

    train:
      type: object
      properties:
        trainNr:
          type: integer
          format: int32
        date:
          type: string
          format: date
        version:
          type: integer
          format: int32
        isReported:
          type: boolean
        assemblyStation:
          type: string
        source:
          type: string
        wagons:
          type: array
          items:
            type: object
            properties:
              capacityBicycle:
                type: integer
                format: int32
              capacityBusinessClass:
                type: integer
                format: int32
              capacityCouchette:
                type: integer
                format: int32
              capacityFirstClass:
                type: integer
                format: int32
              capacitySecondClass:
                type: integer
                format: int32
              capacitySleeper:
                type: integer
                format: int32
              capacityWheelChair:
                type: integer
                format: int32
              destinationName:
                type: string
              features:
                type: integer
                format: int32
              kind:
                type: integer
                format: int32
              lengthOverBuffers:
                type: number
              numPassengerIcons:
                type: integer
                format: int32
              ranking:
                type: integer
                format: int32

        stations:
          type: array
          items:
            type: string

    stationsResponse:
      type: array
      items:
        $ref: "#/components/schemas/station"

    station:
      type: object
      properties:
        eva:
          type: string
          nullable: false
          description: Unique station ID
          example: "8100516"
        name:
          type: string
          nullable: false
          description: Station display name
          example: "Wr. Neustadt Hbf"
