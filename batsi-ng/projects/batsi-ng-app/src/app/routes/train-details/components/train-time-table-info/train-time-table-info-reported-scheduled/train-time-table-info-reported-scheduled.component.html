@if(reported() || scheduled()) {
<div class="d-flex">
  <div>
    <span>{{ label() }}</span>
    <span>&nbsp;</span>
  </div>

  <!-- Reported -->
  @if(reported()) {
  <div
    #reportedCtl
    class="me-1 train-time-table-info__time-reported text-success"
  >
    {{ reported() }}
  </div>
  }

  <!-- Diff -->
  @if(scheduled() !== reported()) {
  <div
    [ngClass]="{
      'train-time-table-info__time-scheduled--out-of-date text-danger':
        reported()
    }"
  >
    {{ scheduled() }}
  </div>
  }
</div>
}
