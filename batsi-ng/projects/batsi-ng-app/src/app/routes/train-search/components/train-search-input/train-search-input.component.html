<div class="card">
  <div class="card-body">
    <div class="card-title">
      <h2>Zug-Daten</h2>
    </div>

    <div class="card-text mt-3">
      <form [formRoot]="form">
        <!-- Train Number -->
        <batsi-input-numeric
          [label]="'Zugnummer'"
          [labelWidth]="7.5"
          [inputMaxWidth]="14"
          [inputPlaceholder]="'z.B. 579'"
          [batsiFormControl]="form.trainNumber"
          [focus$]="trainNumberSetFocus$"
        ></batsi-input-numeric>

        <!-- Station (Number) -->
        <div class="mt-3">
          <batsi-input-datalist
            [dataListId]="'station-list'"
            [label]="'Station'"
            [labelWidth]="7.5"
            [inputMaxWidth]="14"
            [batsiFormControl]="form.stationName"
            [options]="stations() | stationNames"
          ></batsi-input-datalist>
        </div>

        <!-- Date -->
        <div class="input-group mt-3">
          <label class="input-group-text" for="input-date-ctl">Datum</label>
          <input
            id="input-date-ctl"
            type="date"
            class="form-control"
            [formField]="form.date"
          />
        </div>
        @if (form.date().invalid() && form.date().touched()) {
          <div class="text-danger small mt-1">Datum ist erforderlich</div>
        }

        <div class="mt-3 d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" (click)="onReset()">
            Zurücksetzen
          </button>
          <batsi-button-with-spinner
            [label]="'Suchen'"
            [isLoading]="isLoading()"
          ></batsi-button-with-spinner>
        </div>
      </form>
    </div>
  </div>

  <!-- Result -->
  @if (showError()) {
    <output>
      <ul class="list-group list-group-flush">
        <div>
          <li class="list-group-item active">Keine Ergebnisse</li>
        </div>
      </ul>
    </output>
  }
</div>
