<div class="input-group">
  <label
    class="input-group-text"
    [for]="id"
    [ngStyle]="{ 'width.rem': labelWidth() ? labelWidth() : 'inherit' }"
    >{{ label() }}</label
  >
  <input
    [id]="id"
    #inputNumericCtl
    class="ps-3 form-control"
    type="number"
    [placeholder]="inputPlaceholder()"
    step="0"
    [formField]="batsiFormControl()"
    [ngStyle]="{
      'max-width.rem': inputMaxWidth() ? inputMaxWidth() : 'inherit',
    }"
  />
</div>
@if (batsiFormControl()().invalid() && batsiFormControl()().touched()) {
  <div class="text-danger small mt-1">{{ label() }} ist erforderlich</div>
}
