<div class="button-with-spinner__wrapper">
  @if(isLoading() === false) {
  <button class="btn btn-primary d-flex" type="submit">
    {{ label() }}
  </button>
  } @else {
  <div class="spinner-border text-primary d-flex me-4" role="status">
    <span class="visually-hidden">Lädt...</span>
  </div>
  }
</div>
